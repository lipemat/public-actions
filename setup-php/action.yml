###################################################
# Local action to set up the action's environment.
#
# env:
#   PHP_VERSION: PHP version to install.
#
# @version 0.0.3
#
###################################################

name: Setup PHP
description: Install PHP on the server

runs:
  using: "composite"
  steps:

    - name: Install PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: ${{env.PHP_VERSION}}
        tools: cs2pr
