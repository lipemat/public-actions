###################################################
# Lint PHP files in the repository
#
###################################################

name: Lint PHP

env:
  VERSION: 0.1.1

permissions:
  actions: read
  contents: read

on:
  workflow_call:
    inputs:
      php:
        required: true
        type: string

jobs:
  php-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the files
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ inputs.php }}

      - name: Lint PHP
        env:
          WORKSPACE: ${{ github.workspace }}
        run: php -l -d "$WORKSPACE"
