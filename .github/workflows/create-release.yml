###################################################
# Create a GitHub Release when a tag is pushed.
#
# @notice You must enable write permissions for this action to work.
# 1. GitHub Settings
# 2. Actions
# 3. General
# 4. Workflow permissions
# 5. Enable "read and write permissions".
#
###################################################

name: Create GitHub Release

env:
  VERSION: 0.4.0

permissions:
  contents: write
  models: read

on:
  workflow_call:

jobs:
  create-release:
    name: Create a release for ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the files
        uses: actions/checkout@v6
        with:
          fetch-depth: 200

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Get previous tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags $TAG^)
          echo "PREVIOUS_TAG=$PREV_TAG" >> $GITHUB_ENV

      - name: Write Git log to a log.txt file
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git log $PREVIOUS_TAG..$TAG > log.txt
          cat log.txt

      - name: Generate AI Notes for Release
        id: ai-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROMPT="Given the following git log information, generate a single, clear, and concise changelog entry that summarizes the main changes (features, fixes, or bugs) introduced by this Tag. Use neutral, user-facing language and avoid technical jargon or internal references. Write a single paragraph, with no additional introduction or explanation text. Do not mention any version bumps."

          RESPONSE="$(jq -n \
            --arg model 'openai/gpt-5' \
            --arg prompt "$PROMPT" \
            --arg git_log "$(cat log.txt)" \
            '{
              model: $model,
              messages: [
                {
                  role: "user",
                  content: ($prompt + "\n\nGit log:\n" + $git_log)
                }
              ],
              temperature: 0.2
            }' \
            | curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Content-Type: application/json' \
              --data @- \
              'https://models.inference.ai.azure.com/chat/completions')"

          SUMMARY="$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')"

          if [ -z "$SUMMARY" ]; then
            echo 'Failed to generate release notes from GitHub Models response.' >&2
            echo "$RESPONSE" >&2
            exit 1
          fi

          printf '%s\n' "$SUMMARY" > summary.md
          {
            echo 'content<<EOF'
            cat summary.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Version ${{ github.ref_name }}
          draft: false
          body: ${{ steps.ai-notes.outputs.content }}
          generate_release_notes: true
          prerelease: false
