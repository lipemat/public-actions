###################################################
# Create a GitHub Release when a tag is pushed.
#
# @notice You must enable write permissions for this action to work.
# 1. GitHub Settings
# 2. Actions
# 3. General
# 4. Workflow permissions
# 5. Enable "read and write permissions".
#
# secrets:
#   COPILOT_GITHUB_TOKEN: Optional PAT with Copilot access used to
#     summarize the git log into the release body. Without it, the
#     release falls back to GitHub's auto-generated notes.
#
###################################################

name: Create GitHub Release

env:
  VERSION: 0.4.1

permissions:
  contents: write

on:
  workflow_call:
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: false

jobs:
  create-release:
    name: Create a release for ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the files
        uses: actions/checkout@v6
        with:
          fetch-depth: 200

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Get previous tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags $TAG^)
          echo "PREVIOUS_TAG=$PREV_TAG" >> $GITHUB_ENV

      - name: Write Git log to a log.txt file
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git log $PREVIOUS_TAG..$TAG > log.txt
          cat log.txt

      - name: Determine if a Copilot token is available
        id: copilot-token
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -n "$COPILOT_GITHUB_TOKEN" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice::No COPILOT_GITHUB_TOKEN secret; using auto-generated release notes."
          fi

      - name: Build the prompt
        if: ${{ 'true' == steps.copilot-token.outputs.available }}
        run: |
          {
            echo "Given the following git log information, generate a single, clear, and concise changelog entry that summarizes the main changes (features, fixes, or bugs) introduced by this Tag. Use neutral, user-facing language and avoid technical jargon or internal references. Write a single paragraph, with no additional introduction or explanation text. Do not mention any version bumps."
            echo
            cat log.txt
          } > prompt.txt

      - name: Install Node
        if: ${{ 'true' == steps.copilot-token.outputs.available }}
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install the Copilot CLI
        if: ${{ 'true' == steps.copilot-token.outputs.available }}
        run: npm install -g @github/copilot

      - name: Generate AI Notes for Release
        id: ai-notes
        if: ${{ 'true' == steps.copilot-token.outputs.available }}
        uses: actions/ai-inference@v3
        with:
          model: auto
          prompt-file: prompt.txt
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Version ${{ github.ref_name }}
          draft: false
          body: ${{ steps.ai-notes.outputs.response }}
          generate_release_notes: true
          prerelease: false
